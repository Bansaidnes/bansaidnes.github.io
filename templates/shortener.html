{% extends "base.html" %}

{% block content %}
<div class="glass-panel">
    <h1>URL Shortener</h1>    
    <div style="margin-bottom: 20px;">
        <p id="output" style="font-size: 1.2em; font-weight: bold; min-height: 1.5em;">Shortened: </p>
    </div>

    <input type="text" id="input" placeholder="Paste your long URL here..." style="text-align: center;">
    
    <div id="btns" style="margin-top: 20px;">
        <button class="btn" onclick="shorten(document.getElementById('input').value)">Shorten</button>
        <button class="btn" onclick="copy()">Copy</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='UrlShortener/script.js') }}"></script>
{% endblock %}
