{% extends "base.html" %}

{% block head %}
    <meta property="og:title" content="{{ clip_title }}" />
    <meta property="og:description" content="A cool looping video." />
    <meta property="og:site_name" content="bansaidn.es" />
    <meta property="og:type" content="video.other" />
    <meta property="og:video" content="{{ preview_url }}" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="{{ video_width }}" />
    <meta property="og:video:height" content="{{ video_height }}" />
    <meta content="#9d4edd" data-react-helmet="true" name="theme-color" />
{% endblock %}

{% block content %}
<div class="glass-panel" id="clip-panel" style="max-width: 1000px;">
    <h1 style="font-size: 1.5em; margin-bottom: 15px;">{{ clip_name }}</h1>
    <div style="position: relative; width: 100%; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; justify-content: center; background: rgba(0,0,0,0.3);">   
        <video autoplay controls id="player" src="{{ player_url }}" playsinline style="max-width: 100%; max-height: 60vh; width: auto; height: auto; display: block;">
            Your browser does not support video tags >:C
        </video>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}
